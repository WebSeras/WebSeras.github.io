<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBSERA INDEX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

        :root {
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10vh 5vw;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient abstract background */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            background: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.07) 0%, transparent 40%);
            filter: blur(60px);
        }

        body::after {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        h1 {
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 4rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 4rem;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        #site-index {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            z-index: 1;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            aspect-ratio: 1 / 1.1;
            isolation: isolate;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .card:hover::before {
            opacity: 0.8;
        }

        .card-folder {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            margin-bottom: 0.5rem;
            transform: translateY(10px);
            transition: transform 0.4s ease;
        }

        .card-path {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: monospace;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .card:hover .card-folder {
            transform: translateY(0);
        }

        .card:hover .card-path {
            opacity: 1;
            transform: translateY(0);
        }

        /* Abstract shapes inside cards */
        .card .shape {
            position: absolute;
            filter: blur(35px);
            z-index: 0;
            opacity: 0.3;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .shape {
            opacity: 0.6;
            transform: scale(1.3) rotate(15deg);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 0.2em;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        .cursor-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="cursor-glow" id="cursor-glow"></div>
    <h1>WEBSERA INDEX</h1>
    
    <ul id="site-index">
        <li class="status-msg">ANALYZING DIRECTORY STRUCTURE...</li>
    </ul>

    <script>
        // Optional: Interactive cursor glow for abstract feel
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = window.scrollY + e.clientY + 'px';
        });

        async function populateIndex() {
            const listElement = document.getElementById('site-index');
            try {
                // Fetch the repo tree dynamically via GitHub API
                const response = await fetch('https://api.github.com/repos/WebSeras/WebSeras.github.io/git/trees/master?recursive=1');
                
                if (!response.ok) {
                    throw new Error('API fetch failed');
                }
                
                const data = await response.json();
                
                // Find all index.html files not in the root directory
                const indexFiles = data.tree.filter(item => 
                    item.type === 'blob' && 
                    item.path.match(/^.+\/index\.html$/)
                );

                listElement.innerHTML = '';

                if (indexFiles.length === 0) {
                    listElement.innerHTML = '<li class="status-msg">NO SUB-PROJECTS FOUND</li>';
                    return;
                }

                // Abstract color palette
                const palettes = [
                    '#4f46e5', '#ec4899', '#06b6d4', '#f59e0b', '#8b5cf6', '#10b981'
                ];

                indexFiles.forEach((file, index) => {
                    const pathSegments = file.path.split('/');
                    const folderName = pathSegments[pathSegments.length - 2].replace(/[-_]/g, ' ');
                    
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = file.path;
                    a.className = 'card';
                    
                    // Generate abstract shape blob
                    const shape = document.createElement('div');
                    shape.className = 'shape';
                    const size = 150 + Math.random() * 100;
                    shape.style.width = `${size}px`;
                    shape.style.height = `${size}px`;
                    shape.style.background = palettes[index % palettes.length];
                    
                    // Randomize blob position and border-radius
                    const isCircle = Math.random() > 0.5;
                    shape.style.borderRadius = isCircle ? '50%' : '40% 60% 70% 30% / 40% 50% 60% 50%';
                    shape.style.top = `${Math.random() * 20 - 10}%`;
                    shape.style.left = `${Math.random() * 40}%`;
                    
                    const title = document.createElement('div');
                    title.className = 'card-folder';
                    title.textContent = folderName;

                    const subtitle = document.createElement('div');
                    subtitle.className = 'card-path';
                    subtitle.textContent = `/${file.path}`;

                    a.appendChild(shape);
                    a.appendChild(title);
                    a.appendChild(subtitle);
                    li.appendChild(a);
                    
                    listElement.appendChild(li);
                });

            } catch (error) {
                console.error('Error discovering directories:', error);
                // Fallback for local development if rate-limited or offline
                listElement.innerHTML = `
                    <li>
                        <a href="interior-design-1/index.html" class="card">
                            <div class="shape" style="width: 200px; height: 200px; background: #4f46e5; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; top: -10%; left: -10%;"></div>
                            <div class="card-folder">interior design 1</div>
                            <div class="card-path">/interior-design-1/index.html</div>
                        </a>
                    </li>
                `;
            }
        }

        populateIndex();
    </script>
</body>

</html>
