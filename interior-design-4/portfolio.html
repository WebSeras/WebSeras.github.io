<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Elan | Portfolio</title>
    <meta name="description" content="A considered collection of our work.">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/colcade@0/colcade.js"></script>
    <script src="script.js" defer></script>
    <script src="components.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <c-navbar></c-navbar>

    <main>
        <!-- Page Header -->
        <section class="page-header">
            <div class="page-header-bg"></div>
            <div class="page-header-overlay"></div>
            <div class="hero-content">
                <div class="page-eyebrow font-utility uppercase hero-text-line">OUR WORK</div>
                <h1 class="page-heading font-display italic text-h1 hero-text-line ">A Considered Collection</h1>
            </div>
        </section>

        <!-- Filter Bar -->
        <section class="filter-bar reveal">
            <button class="filter-btn font-utility text-xs uppercase active" data-filter="all">All</button>
            <button class="filter-btn font-utility text-xs uppercase" data-filter="residential">Residential</button>
            <button class="filter-btn font-utility text-xs uppercase" data-filter="render">Render</button>
        </section>

        <!-- Portfolio Grid -->
        <section class="portfolio-grid container">
            <div class="grid-col grid-col--1"></div>
            <div class="grid-col grid-col--2"></div>
            <div class="grid-col grid-col--3"></div>
        </section>

        <!-- Studio Note -->
        <section class="studio-note reveal">
            <h2 class="pull-quote font-display italic">"Every space holds a conversation between those who build it and those who live within it."</h2>
            <p class="font-utility text-xs uppercase">&mdash; Elena Voss, Founder</p>
        </section>
    </main>

    <c-footer></c-footer>
</body>
</html>
