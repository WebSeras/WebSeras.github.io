<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Elan | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 140px auto 100px;
            padding: 0 24px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .portfolio-list-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 1px solid var(--divider);
            background: var(--surface);
        }
        .portfolio-list-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
        .portfolio-list-info {
            flex: 1;
        }
        .portfolio-list-info h4 {
            margin-bottom: 4px;
            font-size: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(28, 26, 23, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--divider);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }
        .json-output-wrapper {
            margin-top: 40px;
            border-top: 1px solid var(--divider);
            padding-top: 24px;
        }
        .json-output-wrapper textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--divider);
            color: var(--text-primary);
            margin-bottom: 16px;
        }
    </style>
    <script src="script.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo"><span class="logo-icon"></span>CASA ELAN</a>
        <button class="menu-toggle" aria-label="Toggle Navigation">MENU</button>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="portfolio.html" class="nav-link">Portfolio</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
    </header>

    <main>
        <div class="dashboard-container reveal">
            <div class="dashboard-header">
                <h1 class="font-display italic text-h2">Portfolio Dashboard</h1>
                <button id="add-btn" class="cta-button">Add New Item</button>
            </div>
            
            <div id="portfolio-list" class="item-list">
                <!-- Items injected here -->
            </div>

            <div class="json-output-wrapper">
                <h3 class="font-display text-h3" style="margin-bottom: 16px;">Updated JSON</h3>
                <p class="font-body text-secondary" style="margin-bottom: 16px;">Since the browser cannot directly save to your local filesystem, copy the JSON below and paste it into your <code>portfolio.json</code> file to save your changes, or click the download button below.</p>
                <textarea id="json-output" readonly></textarea>
                <a id="download-json" class="cta-button" style="text-align: center; margin-top: 10px;">Download JSON</a>
            </div>
        </div>

        <!-- Add Item Modal -->
        <div id="add-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="font-display text-h3">Add Portfolio Item</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <form id="add-form" class="contact-form">
                    <div class="form-group">
                        <input type="text" id="field-title" class="form-control" placeholder="Project Title" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="field-location" class="form-control" placeholder="Location (e.g. New York)" required>
                    </div>
                    <div class="form-group">
                        <select id="field-category" class="form-control" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="residential">Residential</option>
                            <option value="commercial">Commercial</option>
                            <option value="art-direction">Art Direction</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="field-image" class="form-control" placeholder="Image URL (e.g. /assets/image_1.jpg)" required>
                    </div>
                    <button type="submit" class="cta-button" style="width: 100%; margin-top: 16px;">Add to Portfolio</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const listContainer = document.getElementById('portfolio-list');
            const jsonOutput = document.getElementById('json-output');
            const downloadBtn = document.getElementById('download-json');
            let portfolioData = [];

            // Load initial data
            fetch('portfolio.json')
                .then(res => res.json())
                .then(data => {
                    portfolioData = data;
                    renderList();
                    updateOutput();
                })
                .catch(err => {
                    console.error("Could not load portfolio.json", err);
                });

            function renderList() {
                listContainer.innerHTML = '';
                portfolioData.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = 'portfolio-list-item';
                    el.innerHTML = `
                        <img src="${item.image}" alt="${item.title}" onerror="this.src='https://placehold.co/80x80/4A443A/F0EBE1?text=Img'">
                        <div class="portfolio-list-info">
                            <h4 class="font-display italic">${item.title}</h4>
                            <p class="font-utility text-xs uppercase">${item.location} &mdash; ${item.category}</p>
                        </div>
                        <button class="cta-button remove-btn" data-index="${index}" style="padding: 8px 16px;">Remove</button>
                    `;
                    listContainer.appendChild(el);
                });

                // Remove logic
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = e.target.getAttribute('data-index');
                        portfolioData.splice(idx, 1);
                        renderList();
                        updateOutput();
                    });
                });
            }

            function updateOutput() {
                const jsonStr = JSON.stringify(portfolioData, null, 4);
                
                // Keep the visual textbox updated
                jsonOutput.value = jsonStr;
                
                // Send the data to your Node server
                fetch('/api/save-portfolio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: jsonStr
                })
                .then(response => response.json())
                .then(data => {
                    // Update button UI to show success
                    downloadBtn.textContent = "Saved to Server";
                    downloadBtn.style.backgroundColor = "var(--text-primary)";
                    downloadBtn.style.color = "var(--bg)";
                    downloadBtn.style.pointerEvents = "none"; // Disable clicking
                    
                    // Reset button after 3 seconds
                    setTimeout(() => {
                        downloadBtn.textContent = "Save Changes";
                        downloadBtn.style.backgroundColor = "var(--accent-light)";
                        downloadBtn.style.color = "#000";
                        downloadBtn.style.pointerEvents = "auto";
                    }, 3000);
                })
                .catch(error => {
                    console.error('Error saving:', error);
                    downloadBtn.textContent = "Error Saving";
                    downloadBtn.style.backgroundColor = "red";
                });
            }

            // Modal logic
            const modal = document.getElementById('add-modal');
            const addBtn = document.getElementById('add-btn');
            const closeBtn = document.getElementById('close-modal');
            const addForm = document.getElementById('add-form');

            addBtn.addEventListener('click', () => modal.classList.add('active'));
            closeBtn.addEventListener('click', () => modal.classList.remove('active'));

            addForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newItem = {
                    category: document.getElementById('field-category').value,
                    image: document.getElementById('field-image').value,
                    title: document.getElementById('field-title').value,
                    location: document.getElementById('field-location').value
                };
                portfolioData.push(newItem);
                renderList();
                updateOutput();
                
                addForm.reset();
                modal.classList.remove('active');
            });
        });
    </script>
</body>
</html>
